name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  reqs-parity:
    # Cheap pre-flight: requirements.txt at repo root and backend/ must
    # stay byte-identical (one drove Render builds, the other drives
    # Cloud Run buildpack). Drift led to one deploy chain succeeding while
    # the other silently pulled the wrong torch wheel — see commit 5b912b8.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check-reqs-parity.sh

  backend-test:
    runs-on: ubuntu-latest
    needs: reqs-parity
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_SECRET_KEY: ci-test-secret-key-not-for-production
      ENCRYPTION_KEY: IYRRmEUTFlRiFfq_-GCdJUN9NqTvfkG6e5s5KTpfpBk=
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r ../requirements.txt
      - run: python manage.py test api.tests -v2 --settings=moodnotes_pro.test_settings

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  deploy-frontend:
    needs: [backend-test, frontend-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      VITE_API_URL: ${{ secrets.VITE_API_URL }}
      VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
      VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: frontend
          wranglerVersion: "4.66.0"
