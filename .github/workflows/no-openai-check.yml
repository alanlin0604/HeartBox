name: no-openai-check

# Enforce the OpenAI cut: no vendor SDK or hardcoded model name may sneak
# back into production code. ``llm_server/`` is excluded because that path
# legitimately speaks an OpenAI-compatible HTTP protocol (TAIDE/LLaVA server).

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  no-openai:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - name: Install ripgrep
        run: sudo apt-get update -qq && sudo apt-get install -y ripgrep

      - name: Reject OpenAI imports + hardcoded model names
        run: |
          set -e
          # ---------------------------------------------------------------
          # Forbidden patterns. Broadened in the Phase 0b adversarial review
          # so the previous (import openai|OPENAI_(API_KEY|MODEL|ORG)|gpt-4o)
          # pattern can no longer be bypassed by:
          #   - OPENAI_BASE_URL / OPENAI_PROJECT / OPENAI_API_BASE (any suffix)
          #   - langchain_openai (the LangChain wrapper that re-imports openai)
          #   - gpt-3.5 / gpt-4 / gpt-4-turbo / gpt-4.1 / o1 / o3 model names
          #   - api.openai.com hardcoded base URLs
          #   - the bare `OpenAI(` constructor (alias-renamed imports)
          # ---------------------------------------------------------------
          PATTERN='((import|from)\s+(openai|langchain_openai)\b|OPENAI_[A-Z_]+|gpt-[34][0-9.o-]*|text-embedding-(ada|3)|api\.openai\.com)'

          EXCLUDES=(
            --glob '!llm_server/**'
            --glob '!.github/workflows/no-openai-check.yml'
            --glob '!docs/**'
            --glob '!research/**'
            --glob '!**/CHANGELOG*'
            --glob '!**/.env*.example'
            --glob '!**/migrations/**'
            --glob '!**/*.lock'
            --glob '!HANDOFF_*.md'
            --glob '!.claude/**'
            --glob '!frontend/dist/**'
            --glob '!frontend/build/**'
            --glob '!**/__pycache__/**'
          )

          if rg -n -e "$PATTERN" "${EXCLUDES[@]}" .; then
            echo ''
            echo '✗ Found banned OpenAI references above.'
            echo '  HeartBox is OpenAI-free in production code as of the 2026-06 capstone migration.'
            echo '  If you intentionally need an OpenAI-compatible HTTP path, place it under llm_server/.'
            exit 1
          fi
          echo '✓ no banned OpenAI references found.'
