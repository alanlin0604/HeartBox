name: Mobile Build

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Build platform"
        required: true
        type: choice
        options:
          - both
          - android
          - ios
      build_type:
        description: "Build type"
        required: true
        type: choice
        options:
          - debug
          - release

env:
  VITE_API_URL: ${{ secrets.VITE_API_URL }}
  VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
  VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}

jobs:
  # ===== Build Web Assets (shared) =====
  web-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: frontend/dist

  # ===== Android Build =====
  android:
    needs: web-build
    if: inputs.platform == 'android' || inputs.platform == 'both'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: frontend/dist

      - run: npm ci

      # Verify the @capgo/capacitor-health patch actually applied. If
      # npm cache + ci timing is wrong the postinstall patch-package step
      # can be skipped and the Galaxy A52 SIGKILL / "permissions empty"
      # symptoms come back. Failing here is much better than shipping a
      # broken APK to the QA device.
      - name: Verify HC patch applied
        run: |
          if ! grep -q "HeartBox patch v" node_modules/@capgo/capacitor-health/android/src/main/java/app/capgo/plugin/health/HealthPlugin.kt; then
            echo "::error::patch-package did NOT apply the HC fix. Aborting build."
            echo "::error::Check that frontend/patches/@capgo+capacitor-health+8.4.5.patch exists and that postinstall ran."
            exit 1
          fi
          echo "::notice::HC patch successfully applied to HealthPlugin.kt."
          grep -c "STAGE_" node_modules/@capgo/capacitor-health/android/src/main/java/app/capgo/plugin/health/HealthPlugin.kt | xargs -I{} echo "::notice::Found {} STAGE_ tags in plugin (expected ≥ 14)."

      # Add Android platform if not committed
      - run: npx cap sync android

      # Sanity check: print the kotlin-stdlib version actually resolved by
      # Gradle for the app module's runtimeClasspath. This is the version
      # that lands in the APK. If it's < 2.1, SpillingKt will be missing
      # at runtime and Health Connect will fail at first suspend. See
      # docs/health-connect-debug-progress.md.
      - name: Verify Kotlin stdlib version in APK
        run: |
          cd android
          chmod +x gradlew
          # Check BOTH debug and release runtime classpaths since the
          # mobile-build matrix produces either depending on build_type.
          for CFG in debugRuntimeClasspath releaseRuntimeClasspath; do
            echo "::group::Resolved kotlin-stdlib in $CFG"
            ./gradlew :app:dependencies --configuration "$CFG" 2>&1 \
              | grep -E "org\.jetbrains\.kotlin:kotlin-stdlib" \
              | head -20 \
              || echo "(no kotlin-stdlib in $CFG?)"
            echo "::endgroup::"
            # Extract the FINAL resolved version (the one after any "->")
            STDLIB_VER=$(./gradlew :app:dependencies --configuration "$CFG" 2>&1 \
              | grep -E "org\.jetbrains\.kotlin:kotlin-stdlib:" \
              | grep -oE "[0-9]+\.[0-9]+\.[0-9]+" \
              | sort -V | tail -1)
            echo "::notice::$CFG resolved kotlin-stdlib: ${STDLIB_VER:-UNKNOWN}"
            MAJOR=$(echo "$STDLIB_VER" | cut -d. -f1)
            MINOR=$(echo "$STDLIB_VER" | cut -d. -f2)
            if [ -z "$STDLIB_VER" ] || [ "$MAJOR" -lt 2 ] || { [ "$MAJOR" -eq 2 ] && [ "$MINOR" -lt 1 ]; }; then
              echo "::error::kotlin-stdlib resolved to ${STDLIB_VER:-NONE} in $CFG — need ≥ 2.1.0 for SpillingKt. APK will crash at Health Connect."
              exit 1
            fi
          done
        working-directory: frontend

      # Decode keystore for release builds
      - name: Decode keystore
        if: inputs.build_type == 'release'
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/heartbox.keystore
        working-directory: frontend

      # Build APK
      - name: Build debug APK
        if: inputs.build_type == 'debug'
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
        working-directory: frontend

      # Release builds produce BOTH the signed AAB (required by Play Store
      # since 2021-08) AND a signed APK (handy for sideloading / device QA).
      # `-Pandroid.injected.signing.store.file` is resolved relative to the
      # gradle daemon working dir (~/.gradle/daemon/...), not the project,
      # so an absolute path is required.
      - name: Build release AAB + APK
        if: inputs.build_type == 'release'
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease assembleRelease \
            -Pandroid.injected.signing.store.file="$PWD/app/heartbox.keystore" \
            -Pandroid.injected.signing.store.password="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.ANDROID_KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.ANDROID_KEY_PASSWORD }}"
        working-directory: frontend

      # Upload APK + AAB. Play Store wants the .aab; the .apk is for
      # device QA before promoting the bundle to production.
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: |
            frontend/android/app/build/outputs/apk/debug/*.apk
            frontend/android/app/build/outputs/apk/release/*.apk
            frontend/android/app/build/outputs/bundle/release/*.aab

  # ===== iOS Build =====
  ios:
    needs: web-build
    if: inputs.platform == 'ios' || inputs.platform == 'both'
    runs-on: macos-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: frontend/dist

      - run: npm ci

      # Add iOS platform and sync
      - run: npx cap sync ios

      # Install CocoaPods dependencies
      - run: cd ios/App && pod install

      # Import signing certificate
      - name: Import certificate and provisioning profile
        if: inputs.build_type == 'release'
        env:
          P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ci-keychain-password
        run: |
          # Create temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain

          # Import certificate
          echo "$P12_BASE64" | base64 --decode > cert.p12
          security import cert.p12 -k build.keychain -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" build.keychain

          # Import provisioning profile
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROVISION_PROFILE_BASE64" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision

      # Build
      - name: Build debug
        if: inputs.build_type == 'debug'
        run: |
          cd ios/App
          xcodebuild build \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

      - name: Build release archive
        if: inputs.build_type == 'release'
        run: |
          cd ios/App
          xcodebuild archive \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -archivePath build/HeartBox.xcarchive \
            -destination "generic/platform=iOS"

      - name: Export IPA
        if: inputs.build_type == 'release'
        run: |
          cd ios/App
          xcodebuild -exportArchive \
            -archivePath build/HeartBox.xcarchive \
            -exportPath build/output \
            -exportOptionsPlist ../../exportOptions.plist

      # Upload
      - uses: actions/upload-artifact@v4
        if: inputs.build_type == 'release'
        with:
          name: ios-ipa
          path: frontend/ios/App/build/output/*.ipa
