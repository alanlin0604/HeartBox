// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {

    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.2.0'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
    // Kotlin stdlib version pin — every transitive dep that ships
    // `org.jetbrains.kotlin:kotlin-stdlib*` gets rewritten to our pinned
    // version. eachDependency is strictly stronger than `force` for this:
    // - `force` is a *resolution rule* and can be lost when a subproject
    //   redeclares a `strictly` constraint or when Groovy GString
    //   interpolation fails silently (`$kotlinVersion` reads as empty in
    //   subproject scope, leaving the force string as
    //   "kotlin-stdlib:" which is silently ignored — this is what the CI
    //   guard caught after my v6 attempt, with stdlib still resolving to
    //   1.7.10 transitively).
    // - eachDependency runs on *every* dependency right as it resolves,
    //   independent of where it was declared, so it covers Capacitor's
    //   plugins, the cordova bridge, and androidx.health.connect's
    //   transitive Kotlin pull.
    // rootProject.ext.kotlinVersion is read explicitly to avoid the
    // subproject scope binding problem.
    configurations.all {
        resolutionStrategy.eachDependency { details ->
            if (details.requested.group == 'org.jetbrains.kotlin' &&
                details.requested.name.startsWith('kotlin-stdlib')) {
                details.useVersion(rootProject.ext.kotlinVersion)
                details.because("SpillingKt is in stdlib ≥ 2.1; @capgo/capacitor-health bytecode needs it")
            }
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
