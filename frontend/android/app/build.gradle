apply plugin: 'com.android.application'

android {
    namespace = "com.heartbox.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.heartbox.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~:!*.gz'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

// Force a single Kotlin runtime version across the whole dependency graph.
//
// Root cause this fixes (REAL, second attempt — first one had the version
// wrong): the plugin/app bytecode references
// `kotlin.coroutines.jvm.internal.SpillingKt`, an internal optimization
// class added in Kotlin 2.1.0. Capacitor 8.0 ships defaulting to
// kotlin_version 2.2.20, so without a pin the resolved kotlin-stdlib
// usually contains SpillingKt — BUT @capgo/capacitor-health 8.4.5 declares
// `implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.9.25'` in its
// build.gradle, which Gradle conflict resolution can latch onto and ship
// kotlin-stdlib 1.9 to the final APK (no SpillingKt) while the bytecode
// still expects 2.1+. Force everything to 2.2.20 so plug-in's declared
// stdlib is overridden and the runtime class is present.
//
// Verified Kotlin compatibility note: SpillingKt was introduced in 2.1.
// Anything ≥ 2.1.0 here works; matching Capacitor's default (2.2.20)
// minimizes surprise.
configurations.all {
    resolutionStrategy {
        force "org.jetbrains.kotlin:kotlin-stdlib:$kotlinVersion"
        force "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlinVersion"
        force "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlinVersion"
        force "org.jetbrains.kotlin:kotlin-stdlib-common:$kotlinVersion"
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // Pin to Kotlin BOM so the whole stdlib family (jdk7, jdk8, common,
    // reflect, …) stays at the same version even if a transitive bump
    // changes one of them. enforcedPlatform overrides any version any
    // other module declares — strictly stronger than a regular `platform`.
    implementation enforcedPlatform("org.jetbrains.kotlin:kotlin-bom:$kotlinVersion")
    implementation 'org.jetbrains.kotlin:kotlin-stdlib'
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
