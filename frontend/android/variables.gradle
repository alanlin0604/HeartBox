ext {
    minSdkVersion = 26  // Minimum Android 8.0 for Health Connect support
    compileSdkVersion = 36
    targetSdkVersion = 36
    // Kotlin runtime version. Must be ≥ 2.1 because the plugin/app bytecode
    // calls kotlin.coroutines.jvm.internal.SpillingKt — that class was
    // ADDED in Kotlin 2.1.0 (not 1.9, contrary to my first guess). The
    // earlier 1.9.25 pin actively broke things by stripping SpillingKt out
    // of the runtime classpath. Aligning with Capacitor 8.0's default of
    // 2.2.20 so the whole graph speaks the same language.
    // Ref: https://capacitorjs.com/docs/updating/8-0
    kotlinVersion = '2.2.20'
    androidxActivityVersion = '1.11.0'
    androidxAppCompatVersion = '1.7.1'
    androidxCoordinatorLayoutVersion = '1.3.0'
    androidxCoreVersion = '1.17.0'
    androidxFragmentVersion = '1.8.9'
    coreSplashScreenVersion = '1.2.0'
    androidxWebkitVersion = '1.14.0'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.3.0'
    androidxEspressoCoreVersion = '3.7.0'
    cordovaAndroidVersion = '14.0.1'
}