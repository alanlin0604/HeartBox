ext {
    minSdkVersion = 26  // Minimum Android 8.0 for Health Connect support
    compileSdkVersion = 36
    targetSdkVersion = 36
    // Kotlin runtime version. Must be ≥ 1.9 because @capgo/capacitor-health 8.4.5
    // ships .class files whose coroutine state machines reference
    // kotlin.coroutines.jvm.internal.SpillingKt (introduced in 1.9). The actual
    // pin is in app/build.gradle resolutionStrategy + explicit kotlin-stdlib
    // dependency — this constant is here for documentation and easy bump.
    kotlinVersion = '1.9.25'
    androidxActivityVersion = '1.11.0'
    androidxAppCompatVersion = '1.7.1'
    androidxCoordinatorLayoutVersion = '1.3.0'
    androidxCoreVersion = '1.17.0'
    androidxFragmentVersion = '1.8.9'
    coreSplashScreenVersion = '1.2.0'
    androidxWebkitVersion = '1.14.0'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.3.0'
    androidxEspressoCoreVersion = '3.7.0'
    cordovaAndroidVersion = '14.0.1'
}