<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
    <meta name="theme-color" content="#7c3aed" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="description" content="HeartBox 心事盒 — 您的私密心情日記，搭載 AI 情緒分析與加密保護，安全記錄每一天的心情。" />

    <!-- PWA Meta Tags -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="HeartBox" />
    <meta name="application-name" content="HeartBox" />
    <meta name="msapplication-TileColor" content="#7c3aed" />
    <meta name="msapplication-config" content="/browserconfig.xml" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="HeartBox — 心事盒" />
    <meta property="og:description" content="AI 驅動的加密心情日記應用程式，記錄、分析並理解你的情緒。" />
    <meta property="og:image" content="https://heartbox.tw/logo.png" />
    <meta property="og:locale" content="zh_TW" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="HeartBox — 心事盒" />
    <meta name="twitter:description" content="AI 驅動的加密心情日記應用程式" />
    <meta name="twitter:image" content="https://heartbox.tw/logo.png" />

    <!-- Alternate language versions -->
    <link rel="alternate" hreflang="zh-Hant" href="https://heartbox.tw/" />
    <link rel="alternate" hreflang="en" href="https://heartbox.tw/" />
    <link rel="alternate" hreflang="ja" href="https://heartbox.tw/" />
    <link rel="alternate" hreflang="x-default" href="https://heartbox.tw/" />

    <!-- DNS Prefetch & Preconnect for critical origins -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    <link rel="dns-prefetch" href="https://heartbox-api-598139488748.asia-east1.run.app" />
    <link rel="dns-prefetch" href="https://accounts.google.com" />
    <link rel="dns-prefetch" href="https://www.gstatic.com" />

    <!-- Font & API preconnect / preload -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&display=swap&subset=latin" as="style" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&display=swap&subset=latin" /></noscript>
    <link rel="preconnect" href="https://heartbox-api-598139488748.asia-east1.run.app" crossorigin />
    <link rel="preconnect" href="https://accounts.google.com" />

    <!-- Preload critical resources. (Vite injects modulepreload for the entry chunk
         during build — manual /src/main.jsx preload would resolve to a dev-only path
         and previously emitted as a broken data:text/jsx URL, costing ~4.8s of FCP.) -->
    <link rel="preload" href="/logo.png" as="image" type="image/png" />

    <!-- Prefetch likely next pages -->
    <link rel="prefetch" href="/dashboard" as="document" />
    <link rel="prefetch" href="/settings" as="document" />

    <title>HeartBox — 心事盒</title>

    <!-- Google Identity Services (for OAuth login) -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
